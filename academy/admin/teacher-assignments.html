<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إسناد المعلمين | أكاديمية رشيد</title>
<link rel="stylesheet" href="../assets/css/styles.css?v=10.0.0">
<style>
.assignment-wrap{max-width:900px}.assignment-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.student-summary{display:flex;gap:12px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:#f8fbf9;margin-bottom:18px}.student-avatar{width:48px;height:48px;border-radius:15px;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.student-summary h2{margin:0 0 4px;font-size:20px}.assignment-list{display:grid;gap:12px}.assignment-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,1.3fr);gap:14px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.subject-name{font-weight:800;color:var(--ink)}.subject-program{font-size:12px;color:var(--muted);margin-top:4px}.assignment-row select{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.empty-state{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
@media(max-width:700px){.assignment-head{display:block}.assignment-head .btn{margin-top:10px}.assignment-row{grid-template-columns:1fr}.actions .btn{width:100%}}
</style>
</head>
<body data-admin-page="teacher-assignments">
<header class="topbar"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">ر</span><span>أكاديمية رشيد<small>إسناد المعلمين</small></span></a><a class="btn btn-secondary" href="#" data-admin-logout>تسجيل الخروج</a></div></header>
<main class="page"><div class="container layout">
<aside class="sidebar"><a href="dashboard.html">نظرة عامة</a><a href="registrations.html">طلبات التسجيل</a><a class="active" href="students.html">الطلاب</a><a href="teachers.html">المعلمون</a><a href="lessons.html">الحصص</a><a href="#" data-demo-alert>التقارير</a></aside>
<section class="assignment-wrap">
<div class="assignment-head"><div><h1 class="page-title">إسناد المعلمين</h1><p class="muted">اختر معلمًا واحدًا لكل مادة، ثم اضغط حفظ.</p></div><a class="btn btn-light" id="backToRecord" href="students.html">العودة إلى سجل الطالب</a></div>
<div id="assignmentError" class="notice hide"></div>
<div id="assignmentPanel" class="panel hide">
  <div class="student-summary"><div class="student-avatar" id="assignmentStudentInitial">ط</div><div><h2 id="assignmentStudentName">—</h2><div class="muted" id="assignmentStudentCode">—</div></div></div>
  <div id="assignmentRows" class="assignment-list"><div class="muted">جارٍ تحميل المواد...</div></div>
  <div class="actions"><button class="btn btn-primary" id="saveTeacherAssignments" type="button">حفظ الإسناد</button><a class="btn btn-secondary" id="cancelAssignments" href="students.html">إلغاء</a></div>
  <p class="muted" id="assignmentSaveStatus" style="margin:12px 0 0"></p>
</div>
</section></div></main>
<script src="../assets/js/admin.js?v=10.0.0"></script>
<script>document.addEventListener('click',e=>{const a=e.target.closest('[data-demo-alert]');if(a){e.preventDefault();alert('هذه الوحدة ضمن المرحلة التالية من نظام الأكاديمية.');}});</script>
</body></html>
